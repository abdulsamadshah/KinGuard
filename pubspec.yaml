name: kinguard
description: "A new Flutter project."
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2
  page_transition: ^2.2.1
  flutter_svg: ^2.2.1
  dio: ^5.9.0
  fluttertoast: ^9.1.0
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.0
  image_cropper: ^12.2.1

  firebase_messaging: ^16.0.1
  firebase_core: ^4.1.0
  firebase_database: ^12.0.1

  pretty_dio_logger: ^1.4.0
  pin_code_text_field: ^1.8.0
  geolocator: ^14.0.2

  location: ^8.0.1
  flutter_image_compress: ^2.4.0
  skeletonizer: ^2.1.0+1
  share_plus: ^12.0.0

  permission_handler: ^12.0.1

  app_links: ^6.4.1


  google_maps_flutter: ^2.13.1
  connectivity_plus: ^7.0.0

  geocoding: ^4.0.0
  go_router: ^16.2.5
  easy_localization: ^3.0.8
  awesome_notifications: ^0.11.0
  flutter_riverpod: ^3.3.2
  http_parser: ^4.1.2



dev_dependencies:
  build_runner: any
  #flutter packages pub run build_runner build
  flutter_gen_runner: ^5.11.0

  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true
  assets:
    - asset/images/
    - asset/icons/
    - asset/animations/
    - asset/music/

  fonts:
    - family: InterBlack
      fonts:
        - asset: asset/fonts/Inter-Black.ttf

    - family: InterBold
      fonts:
        - asset: asset/fonts/Inter-Bold.ttf

    - family: InterExtraBold
      fonts:
        - asset: asset/fonts/Inter-ExtraBold.ttf

    - family: InterExtraLight
      fonts:
        - asset: asset/fonts/Inter-ExtraLight.ttf

    - family: InterLight
      fonts:
        - asset: asset/fonts/Inter-Light.ttf

    - family: InterMedium
      fonts:
        - asset: asset/fonts/Inter-Medium.ttf

    - family: InterRegular
      fonts:
        - asset: asset/fonts/Inter-Regular.ttf

    - family: InterSemiBold
      fonts:
        - asset: asset/fonts/Inter-SemiBold.ttf

    - family: InterThin
      fonts:
        - asset: asset/fonts/Inter-Thin.ttf